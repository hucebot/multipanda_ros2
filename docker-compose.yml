services:
  realtime_franka_humble:
    image: hucebot:franka-humble
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: realtime_franka_humble
    tty: true
    environment:
      - DISPLAY=:0
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=39
      - CYCLONEDDS_URI=file:///etc/ros2/cyclonedds.xml
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    network_mode: host
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    privileged: true
    group_add:
      - dialout
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./franka_bringup:/home/user/humble_ws/src/bimanual_architecture/franka_bringup
      - ./franka_example_controllers:/home/user/humble_ws/src/bimanual_architecture/franka_example_controllers
      - ./franka_simple_publishers:/home/user/humble_ws/src/bimanual_architecture/franka_simple_publishers
      - ./franka_description:/home/user/humble_ws/src/bimanual_architecture/franka_description
      - ./franka_move_linear:/home/user/humble_ws/src/bimanual_architecture/franka_move_linear
      - ./bota_driver_ros2:/home/user/humble_ws/src/bimanual_architecture/bota_driver_ros2
      - ./bota_driver_ros2_example:/home/user/humble_ws/src/bimanual_architecture/bota_driver_ros2_example
      - ./cyclonedds.xml:/etc/ros2/cyclonedds.xml