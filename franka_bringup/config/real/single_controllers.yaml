controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

    model_example_controller:
      type: franka_example_controllers/ModelExampleController
    
    joint_impedance_example_controller:
      type: franka_example_controllers/JointImpedanceExampleController
    
    cartesian_impedance_example_controller:
      type: franka_example_controllers/CartesianImpedanceExampleController
      
    custom_cartesian_impedance_controller:
      type: franka_example_controllers/CustomCartesianImpedanceController

    move_to_start_example_controller:
      type: franka_example_controllers/MoveToStartExampleController

franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda

model_example_controller:
  ros__parameters:
    arm_id: panda

cartesian_impedance_example_controller:
  ros__parameters:
    arm_id: panda

joint_impedance_example_controller:
  ros__parameters:
    arm_id: panda
    k_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 10.0
      - 6.0
      - 2.0
    d_gains:
      - 2.0
      - 2.0
      - 2.0
      - 1.0
      - 1.0
      - 1.0
      - 0.5

custom_cartesian_impedance_controller:
  ros__parameters:
    arm_id: panda

move_to_start_example_controller:
  ros__parameters:
    arm_id: panda
    k_gains:
      - 500.0
      - 500.0
      - 500.0
      - 500.0
      - 200.0
      - 150.0
      - 50.0
    d_gains:
      - 50.0
      - 50.0
      - 50.0
      - 50.0
      - 20.0
      - 15.0
      - 10.0