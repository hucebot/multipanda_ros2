# ForceVAM's force law in the 1 kHz loop (launch/real/franka_law.launch.py): the multi-mode controller with
# panda_cartesian_law_controller started (the planned pose on panda/panda_cartesian_law_controller/desired_pose, the
# law's settings through panda/panda_cartesian_law_controller/parameters), the joint impedance controller available.
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

    multi_mode_controller:
      type: multi_mode_controller/MultiModeController

franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda

multi_mode_controller:
  ros__parameters:
    arm_count: 1
    arm_1:
      arm_id: panda
    controllers: ["panda_joint_impedance_controller", "panda_cartesian_law_controller"]
    resources:
        panda_joint_impedance_controller: ["panda"]
        panda_cartesian_law_controller: ["panda"]
    start_controllers:
        names: ["panda_cartesian_law_controller"]
        resources:
            panda_cartesian_law_controller: ["panda"]
    panda_cartesian_law_controller:
      force_topic: "/bota_ft_sensor/wrench"   # the Bota driver's raw wrench (sensor frame)
      force_timeout: 0.1                      # s: an older force counts as zero
      sensor_rpy: [0.0, 0.0, 0.0]             # rad: the sensor frame in the end-effector frame (O_T_EE; TO MEASURE before contact)
      force_sign: 1.0                         # +1: the force the flange exerts on the hand (the law's convention); -1: the opposite
